const fmt=n=>numeric(n)?Number(n).toFixed(Number.isInteger(Number(n))?0:1):'—';
const sign=n=>numeric(n)?(Number(n)>0?'+':'')+fmt(n):'—';
const prettyDate=iso=>{const d=new Date(String(iso).slice(0,10)+'T12:00:00Z');return Number.isNaN(d.getTime())?String(iso||'TBD'):d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})};
const getResult=w=>results.find(r=>Number(r.week)===Number(w))||{};
const completed=()=>results.filter(r=>numeric(r.kyleGross)&&numeric(r.ryanGross));
const completedTeam=()=>results.filter(r=>numeric(r.scrambleGross));
const average=vals=>vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'—';
function stats(){const all=completed(),k=all.filter(r=>Number(r.kyleGross)<Number(r.ryanGross)).length,g=all.filter(r=>Number(r.ryanGross)<Number(r.kyleGross)).length,t=all.length-k-g;
const kpt=results.reduce((x,r)=>x+(numeric(r.kylePts)?Number(r.kylePts):0),0),gpt=results.reduce((x,r)=>x+(numeric(r.ryanPts)?Number(r.ryanPts):0),0);
const kavg=average(all.filter(r=>numeric(r.kyleToPar)).map(r=>Number(r.kyleToPar))),gavg=average(all.filter(r=>numeric(r.ryanToPar)).map(r=>Number(r.ryanToPar)));
return {all,k,g,t,kpt,gpt,kavg,gavg,bestKyle:all.length?Math.min(...all.map(r=>Number(r.kyleGross))):'—',bestRyan:all.length?Math.min(...all.map(r=>Number(r.ryanGross))):'—',team:completedTeam(),teamBest:completedTeam().length?Math.min(...completedTeam().map(r=>Number(r.scrambleGross))):'—'};}
function kpi(label,value,sub){return `<div class="kpi"><div class="lbl">${esc(label)}</div><div class="val">${esc(value)}</div><div class="sub">${esc(sub)}</div></div>`;}
function h(title,subtitle,extra=''){return `<div class="sectiontop"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div>${extra}</div>`;}
const nextWeek=()=>schedule.find(s=>{const r=getResult(s.week);return !numeric(r.kyleGross)||!numeric(r.ryanGross)||!numeric(r.scrambleGross)})||schedule[schedule.length-1];
function standings(){const d=stats();const players=[{n:'Kyle Hiscock',w:d.k,p:d.kpt,avg:d.kavg},{n:'Ryan Grace',w:d.g,p:d.gpt,avg:d.gavg}].sort((a,b)=>b.p-a.p||b.w-a.w);return `<table class="standings"><thead><tr><th>Player</th><th>Stroke Wins</th><th>Avg ± Par</th><th>Cup Points</th></tr></thead><tbody>${players.map((p,i)=>`<tr><td><strong>${i+1}. ${esc(p.n)}</strong></td><td>${p.w}</td><td>${esc(p.avg)}</td><td class="win"><strong>${p.p}</strong></td></tr>`).join('')}</tbody></table>`;}
function home(){const d=stats(),n=nextWeek();return `<section class="hero"><div class="herogrid"><div class="headline"><img class="hero-logo" src="winter-grind-logo.svg" alt="Winter Grind Tour crest"><div class="eyebrow">Kyle Hiscock × Ryan Grace · 2026–27</div><h1>The <span>Winter Grind</span> Tour.</h1><p class="lede">Two friends. Two different courses. <strong>18 holes of two-man scramble first, followed by 18 holes of individual stroke play</strong> every Tuesday. A head-to-head Winter Cup and a team scramble record to chase all season.</p><div class="hero-meta"><span class="meta">Oct 27 – Feb 9</span><span class="meta">16 themed Tuesdays</span><span class="meta">32 distinct GSPro courses</span><span class="meta">18-hole scramble → 18-hole stroke play</span><span class="meta">Skramble House of Golf ROC</span></div></div><aside class="next"><div class="week">Week ${esc(n.week)} · ${esc(prettyDate(n.date))}</div><h2>${esc(n.theme)}</h2><div class="divider"></div><div class="week">Round 1 · 18 Holes · 2-Man Scramble · 2-ft gimmes</div><h2>${esc(n.scramble)}</h2><p>${esc(n.teeScramble)} · ${esc(n.windScramble)} wind</p><div class="divider"></div><div class="week">Round 2 · 18 Holes · Individual Stroke Play · 5-ft gimmes</div><h2>${esc(n.stroke)}</h2><p>${esc(n.teeStroke)} · ${esc(n.windStroke)} wind</p><div class="divider"></div><div class="small">Stimp 11 · Force Realistic · No mulligans</div></aside></div></section><section class="section"><div class="kpis">${kpi('Stroke rounds',d.all.length,'of 16 planned')}${kpi('Team scrambles',d.team.length,'of 16 planned')}${kpi('Kyle Cup points',d.kpt,'individual stroke play')}${kpi('Ryan Grace Cup points',d.gpt,'individual stroke play')}</div><div class="cols"><div class="card"><h3>The Winter Cup</h3>${standings()}<p class="intro">Two points per stroke-play win, one apiece for a tie. Team scrambles do not award individual Cup points.</p></div><div class="card"><h3>The team challenge</h3>${kpi('Best team scramble gross',d.teamBest,'18-hole team record')}<p class="intro">Scramble tracking includes hole scoring averages, eagles+, birdies, pars, bogeys and double bogeys or worse.</p></div></div></section>`;}
function tour(){return `<section class="section" style="padding-top:32px">${h('Sixteen themed Tuesdays','Round 1: 18-hole two-man scramble. Round 2: 18-hole individual stroke play. Two courses, 6,000–7,000 yard tees.')}<div class="schedulegrid">${schedule.map(s=>`<article class="course"><div class="course-side"><div class="lbl">${esc(prettyDate(s.date))}</div><div class="no">${String(s.week).padStart(2,'0')}</div><div class="lbl">${esc(s.status)}</div></div><div class="course-body"><div class="theme-title">${esc(s.theme||'Tour Week')}</div><div class="theme">Round 1 · 18 Holes · 2-Man Scramble · 2-ft gimmes</div><h3>${esc(s.scramble)}</h3><div class="tee-detail">${esc(s.teeScramble)} · ${esc(s.windScramble)} wind</div><div class="gsname">GSPro: ${esc(s.scrambleGs)} · FWY ${esc(s.scrambleFairway)} · Greens ${esc(s.scrambleGreen)}</div><div class="theme" style="margin-top:14px">Round 2 · 18 Holes · Individual Stroke Play · 5-ft gimmes</div><h3>${esc(s.stroke)}</h3><div class="tee-detail">${esc(s.teeStroke)} · ${esc(s.windStroke)} wind</div><div class="gsname">GSPro: ${esc(s.strokeGs)} · FWY ${esc(s.strokeFairway)} · Greens ${esc(s.strokeGreen)}</div><div class="bottom"><span class="pill">Stimp 11</span><span class="pill">Force Realistic</span><span class="pill">Mulligans off</span></div><div class="course-links">${s.sourceStroke?`<a href="${esc(s.sourceStroke)}" target="_blank" rel="noopener noreferrer">Stroke course details ↗</a>`:''}${s.sourceScramble?`<a href="${esc(s.sourceScramble)}" target="_blank" rel="noopener noreferrer">Scramble details ↗</a>`:''}</div></div></article>`).join('')}</div><p class="intro" style="margin-top:20px">The source links are independent GSPro course-directory listings, not confirmation that Skramble has each model installed. Course conditions are suggested presets. Exact tee selection and availability must be verified at the simulator.</p></section>`;}
function resultsPage(){
const posted=results.filter(r=>numeric(r.kyleGross)||numeric(r.ryanGross)||numeric(r.scrambleGross));
return `<section class="section" style="padding-top:32px">${h('Scorecards & results','Round 1 is the two-man scramble; Round 2 is Kyle vs Ryan Grace in stroke play.')}${posted.length?posted.slice().reverse().map(r=>`<div class="card" style="margin-bottom:16px"><div class="eyebrow">Week ${esc(r.week)} · ${esc(prettyDate(r.date||schedule[Number(r.week)-1]?.date))}</div><div class="theme-title">Round 1 · 18-hole two-man scramble</div><h3>${esc(r.scramble||'Scramble')}</h3><p class="intro">Team score: <strong>${fmt(r.scrambleGross)}</strong> · To par: <strong>${sign(r.scrambleToPar)}</strong></p><div class="gimme-pills"><span class="score-stat">Eagles+ ${fmt(r.teamEagles)}</span><span class="score-stat">Birdies ${fmt(r.teamBirdies)}</span><span class="score-stat">Pars ${fmt(r.teamPars)}</span><span class="score-stat">Bogeys ${fmt(r.teamBogeys)}</span><span class="score-stat">Doubles+ ${fmt(r.teamDoubles)}</span></div><div class="divider" style="height:1px;background:var(--line);margin:19px 0"></div><div class="theme-title">Round 2 · 18-hole individual stroke play</div><h3>${esc(r.stroke)}</h3><div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr));margin:10px 0">${kpi('Kyle Hiscock',fmt(r.kyleGross),sign(r.kyleToPar))}${kpi('Ryan Grace',fmt(r.ryanGross),sign(r.ryanToPar))}${kpi('Winner',r.winner||'—','Winter Cup')}</div><button class="linkbutton" data-show-week="${Number(r.week)}">View 18-hole breakdown</button></div>`).join(''):`<div class="empty"><h3>${feedState==='unavailable'?'Results temporarily unavailable':feedState==='loading'?'Loading tour results…':'The first results are coming soon'}</h3><p>${feedState==='unavailable'?'Please refresh this page shortly. The tour schedule remains available above.':feedState==='loading'?'Checking for the latest completed scorecards.':'Once the first rounds have been played, verified scores will appear here automatically.'}</p></div>`}</section>`;}
function holeTable(){
const wk=Number(selectedWeek),stroke=strokeHoles.filter(h=>Number(h.week)===wk),team=scrambleHoles.filter(h=>Number(h.week)===wk);
if(!stroke.length&&!team.length)return `<div class="empty">No scorecard data entered yet for Week ${wk}. The scorecards will appear here once verified.</div>`;
const st=Array.from({length:18},(_,i)=>{const h=i+1, t=team.find(x=>Number(x.hole)===h)||{};return `<tr><td>${h}</td><td>${fmt(t.par)}</td><td>${fmt(t.strokes)}</td><td>${esc(t.outcome||'—')}</td></tr>`;}).join('');
const sp=Array.from({length:18},(_,i)=>{const h=i+1, t=stroke.find(x=>Number(x.hole)===h)||{};return `<tr><td>${h}</td><td>${fmt(t.par)}</td><td>${fmt(t.kyle)}</td><td>${fmt(t.ryan)}</td></tr>`;}).join('');
return `<div class="statgrid"><div><div class="theme-title">Round 1 · Scramble</div><div style="overflow:auto"><table class="standings"><thead><tr><th>Hole</th><th>Par</th><th>Team</th><th>Result</th></tr></thead><tbody>${st}</tbody></table></div></div><div><div class="theme-title">Round 2 · Stroke play</div><div style="overflow:auto"><table class="standings"><thead><tr><th>Hole</th><th>Par</th><th>Kyle</th><th>Ryan Grace</th></tr></thead><tbody>${sp}</tbody></table></div></div></div><p class="intro" style="margin-top:16px">Individual FW Hit, GIR, average driving distance and feet of putts made belong to the full round, not a particular hole.</p>`;}
function statPage(){
const d=stats(),recorded=results.filter(r=>numeric(r.kFw)||numeric(r.gFw)||numeric(r.kGir)||numeric(r.gGir)||numeric(r.kDrive)||numeric(r.gDrive)||numeric(r.kFeet)||numeric(r.gFeet));
return `<section class="section" style="padding-top:32px">${h('Player & hole analytics','Hole-by-hole scoring, with individual GSPro performance metrics recorded separately for the complete stroke-play round.')}<div class="kpis">${kpi('Kyle avg ±Par',d.kavg,'completed stroke rounds')}${kpi('Ryan Grace avg ±Par',d.gavg,'completed stroke rounds')}${kpi('Kyle best gross',d.bestKyle,'18-hole stroke play')}${kpi('Ryan Grace best gross',d.bestRyan,'18-hole stroke play')}</div><div class="card" style="margin-bottom:18px"><div class="course-head"><div><h3 style="margin-bottom:3px">Hole-by-hole scoring</h3><p class="intro">18 holes of team scramble and 18 holes of individual stroke play.</p></div><select class="filter" id="weekFilter" aria-label="Select week">${schedule.map(s=>`<option value="${s.week}" ${selectedWeek===Number(s.week)?'selected':''}>Week ${s.week}</option>`).join('')}</select></div>${holeTable()}</div><div class="card"><h3>Individual stroke-play stats · Full round only</h3>${recorded.length?`<div style="overflow:auto"><table class="standings" style="min-width:880px"><thead><tr><th>Week</th><th>Kyle FW Hits</th><th>Ryan FW Hits</th><th>Kyle GIR</th><th>Ryan GIR</th><th>Kyle Avg Drive (yd)</th><th>Ryan Avg Drive (yd)</th><th>Kyle Putts Made (ft)</th><th>Ryan Putts Made (ft)</th></tr></thead><tbody>${recorded.map(r=>`<tr><td>${r.week}</td><td>${fmt(r.kFw)}</td><td>${fmt(r.gFw)}</td><td>${fmt(r.kGir)}</td><td>${fmt(r.gGir)}</td><td>${fmt(r.kDrive)}</td><td>${fmt(r.gDrive)}</td><td>${fmt(r.kFeet)}</td><td>${fmt(r.gFeet)}</td></tr>`).join('')}</tbody></table></div>`:`<p class="intro">Individual performance data will populate when the round-level GSPro screenshots are provided. No per-hole FW/GIR or putt-distance inputs are required.</p>`}</div></section>`;}
function rules(){
const items=[['01 · Round order','Round 1: 18-hole two-man scramble on one GSPro course. Round 2: 18-hole individual gross stroke play on a different course.'],['02 · Cup standings','Round 2 stroke-play winner earns two points; a tie earns one point each. Round 1 scramble is a shared team-record challenge.'],['03 · Standard simulator settings','Stimp 11, Force Realistic, no mulligans, 6,000–7,000-yard tee selection. Scramble uses 2-foot gimmes; stroke play uses 5-foot gimmes.'],['04 · Weekly course presets','Course-specific fairway/green firmness, pins and wind vary to reflect each course’s style. These are tour presets, not guaranteed real-world turf conditions.'],['05 · What to photograph','After Round 1: 18-hole scramble team scorecard. After Round 2: 18-hole Kyle/Ryan Grace scorecard plus each individual’s full-round GSPro stats screenshot.'],['06 · Performance tracking','Only the stroke-play stats screenshots supply round totals for FW Hit, GIR, average driving distance and feet of putts made. The hole-by-hole table is scores only.'],['07 · Data integrity','No stats are estimated from hole scores. Missing values remain blank; 18-hole totals require all 18 scores. Scramble tracks hole scores and automatic scoring categories.'],['08 · Winner & records','After 16 weeks the most Winter Cup points wins; tie breakers are stroke wins, average score versus par, and a playoff. Scramble records belong to both players.']];
return `<section class="section" style="padding-top:32px">${h('Tour rules & photo workflow','Two courses, consistent settings, round totals separate from hole scores.')}<div class="rulesgrid">${items.map(x=>`<div class="card rule"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`).join('')}</div><p class="intro" style="margin-top:14px">Unofficial simulator tour; scores are not automatically WHS/GHIN handicap rounds. Check GSPro course files at the venue.</p></section>`;}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===page));document.getElementById('app').innerHTML=({home,schedule:tour,results:resultsPage,stats:statPage,rules})[page]();const wk=document.getElementById('weekFilter');if(wk)wk.addEventListener('change',e=>{selectedWeek=Number(e.target.value);render()});}
document.addEventListener('click',e=>{const w=e.target.closest('[data-show-week]');if(w){selectedWeek=Number(w.dataset.showWeek);page='stats';render();window.scrollTo({top:0,behavior:'smooth'});return;}const b=e.target.closest('[data-tab]');if(b){page=b.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});}});
document.getElementById('homeBrand').addEventListener('click',e=>{e.preventDefault();page='home';render()});
window.receiveLeagueData=function(data){if(!data||!Array.isArray(data.schedule)||!Array.isArray(data.results)){feedState='unavailable';render();return;}schedule=data.schedule.length?data.schedule.map(x=>({...base.find(b=>Number(b.week)===Number(x.week)),...x})):schedule;results=data.results;strokeHoles=Array.isArray(data.strokeHoles)?data.strokeHoles:[];scrambleHoles=Array.isArray(data.scrambleHoles)?data.scrambleHoles:[];feedState='ready';render();};
if(APPS_SCRIPT_URL){const script=document.createElement('script');script.src=APPS_SCRIPT_URL+(APPS_SCRIPT_URL.includes('?')?'&':'?')+'callback=receiveLeagueData';script.async=true;script.onerror=()=>{feedState='unavailable';render()};document.head.appendChild(script)}

render();

</script></body></html>
