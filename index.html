/* Evergreen identity · forest green, warm cream and copper-gold · permanent. */
body{background:radial-gradient(ellipse at 90% -10%,var(--panel2),transparent 52%),var(--bg)}
.topbar{background:color-mix(in srgb,var(--bg) 92%,transparent)}
.next{background:linear-gradient(145deg,var(--panel2),var(--panel));border-color:var(--line)}
.course-side{background:linear-gradient(160deg,var(--panel2),var(--bg2))}
.sheet-link,.linkbutton{background:var(--panel2);border-color:var(--line)}
.chip.preview{background:var(--panel2);border-color:var(--gold);color:var(--gold)}
.course .theme-title,.tee-detail,.course-links a{color:var(--gold)}


@media(max-width:680px){
  .topinner{flex-wrap:wrap;gap:4px;padding:9px 0}
  .brand{min-width:0;flex:1 1 100%}
  .brand .crest-logo{width:52px;height:52px;flex-shrink:0}
  .brand small{font-size:10px;letter-spacing:.055em}
  .topright{width:100%;flex-wrap:wrap;justify-content:space-between;gap:8px}
  .topright .sheet-link{display:none}
  .topright .eyebrow{font-size:10px}
  .topright .chip{font-size:9px;max-width:155px;padding:6px 8px;white-space:normal;line-height:1.3}
  .hero .headline h1{font-size:35px}
  .kpi .lbl{font-size:10px}
  .hero-logo{width:106px;height:106px}
  .brand strong{font-size:12px}
  .next{padding:19px}
}

.series-label{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:800;white-space:nowrap}
@media(max-width:680px){.topright{display:none}}

/* Winter Grind Tour 2026–27 • mobile-first weekly scorecard experience */
html{scroll-padding-top:128px}
#app{min-height:58vh}
.section{padding-top:32px}
a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.quiet-link{font-size:12px;font-weight:800;color:var(--gold);text-decoration:none;letter-spacing:.015em}
.quiet-link:hover{text-decoration:underline}
.inline-week{display:inline-block;margin-top:18px}
.tiny-heading{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.095em;text-transform:uppercase}
.muted-note{color:var(--muted);font-size:13px;line-height:1.6}
.linkbutton{text-decoration:none;display:inline-flex;justify-content:center;align-items:center;min-height:40px}
.linkbutton:hover,.tour-open:hover{border-color:var(--gold)}
.hero{padding:28px 0 18px}
.spotlight{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:14px;margin-top:9px}
.spotlight-main{background:linear-gradient(140deg,#204537 0%,#142b24 68%,#10241e);border:1px solid var(--line);border-radius:20px;padding:27px;overflow:hidden}
.spotlight-top,.detail-utility,.spotlight-foot{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.event-kicker{font-size:11px;letter-spacing:.12em;font-weight:900;color:var(--gold)}
.brand-hero{display:flex;justify-content:space-between;gap:16px;align-items:center}
.brand-hero h1{font:600 clamp(35px,4vw,55px)/1.07 Georgia,serif;letter-spacing:-.045em;margin:12px 0}
.brand-hero h1 span{color:var(--gold)}
.brand-hero p{color:var(--muted);margin:0}
.hero-crest{width:112px;height:112px;object-fit:contain;flex:0 0 112px;filter:drop-shadow(0 10px 13px #0006)}
.spotlight-theme{font:600 24px Georgia,serif;margin:20px 0 10px}
.spotlight-courses,.round-two-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.spotlight-courses>div{background:#0f251e9a;border:1px solid #496b5b;padding:15px;border-radius:12px;min-width:0}
.spotlight-courses h3{font-size:21px;line-height:1.15;margin:9px 0 7px;overflow-wrap:anywhere}
.spotlight-courses p{font-size:12px;color:var(--muted);margin:0}
.spotlight-foot{margin-top:18px;color:var(--muted);font-size:12px}
.spotlight-side{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
.season-big{font:bold 62px Georgia,serif;color:var(--gold);line-height:1;margin:18px 0}
.season-big span{font:800 12px system-ui;display:block;letter-spacing:.2em;margin-top:6px}
.spotlight-side p{font-size:13px;color:var(--muted)}
.spotlight-side-divider{height:1px;background:var(--line);margin:24px 0}
.record-mini{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin:25px 0 10px}
.record-mini strong{font-size:30px;color:var(--ink)}
.course-round2{margin-top:16px}
.tour-open{display:inline-block;margin-top:15px;padding-top:11px;border-top:1px solid var(--line);color:var(--gold);font-size:12px;text-decoration:none;font-weight:800}
.detail-page{padding-top:22px}
.detail-heading{font:600 clamp(32px,4vw,52px)/1.1 Georgia,serif;margin:13px 0}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.detail-actions button{cursor:pointer}
.detail-utility{margin-bottom:15px}
.bottom-switch{border-top:1px solid var(--line);padding-top:25px;margin-top:30px}
.round-two-grid{margin:20px 0 33px}
.round-course{padding:21px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.round-course h3{font:600 25px Georgia,serif;margin:10px 0 9px}
.course-tees{font-weight:800;color:var(--gold);margin-bottom:8px}
.course-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:17px 0 12px}
.course-detail-grid span{display:flex;flex-direction:column;gap:1px;font-size:11px;color:var(--muted)}
.course-detail-grid strong{font-size:13px;color:var(--ink)}
.round-course>a{color:var(--gold);font-size:12px;font-weight:800;text-decoration:none}
.result-chip{display:flex;gap:10px;align-items:center;font-size:27px;font-weight:850;font-variant-numeric:tabular-nums;color:var(--ink)}
.result-chip span{font-size:15px;color:var(--gold)}
.scores-gap{margin-top:32px}
.player-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:15px 0}
.score-summary{padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:4px}
.score-summary>span{color:var(--muted);font-size:11px;letter-spacing:.06em;font-weight:800}
.score-summary strong{font-size:30px;line-height:1.35;font-variant-numeric:tabular-nums}
.score-summary small{color:var(--gold);font-size:13px}
.score-summary .winner-name{font-size:18px}
.nine-block{margin:0 0 15px}
.nine-heading{display:flex;justify-content:space-between;color:var(--ink);font-size:14px;margin:12px 0 9px}
.nine-heading>span{color:var(--muted);font-size:12px}
.hole-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:7px}
.hole-tile{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px 7px}
.hole-caption{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:850;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:7px;white-space:nowrap}
.hole-caption span{font-size:10px;color:var(--gold)}
.tile-row{display:flex;justify-content:space-between;gap:3px;align-items:center;font-size:10px;color:var(--muted);min-height:30px}
.score-mark{display:inline-flex;min-width:28px;min-height:28px;padding:2px 4px;border-radius:8px;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;font-size:14px;font-weight:900;color:var(--ink)}
.score-mark.eagle{background:#dfb24e;color:#1d241e;border-radius:50%}
.score-mark.birdie{background:#376d5d;border:1px solid #b8e9c4;color:white;border-radius:50%}
.score-mark.par{border:1px solid #658473;background:transparent}
.score-mark.bogey{background:#6f4650;border:1px solid #ce9ba0}
.score-mark.double{background:#4c2632;border:2px double #d497a4}
.score-mark.unknown{background:#1a342a;color:#b8cbc1}
.split-totals{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:14px 0;padding:10px 16px}
.split-head,.split-line{display:grid;grid-template-columns:minmax(90px,1fr) repeat(3,70px);gap:8px;align-items:center;padding:6px 0;font-size:13px}
.split-head{color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.split-head>:not(:first-child),.split-line>:not(:first-child){text-align:right}
.score-legend{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-bottom:18px}
.score-legend span{display:flex;align-items:center;gap:5px}
.score-legend i{width:12px;height:12px;border-radius:50%;display:block;border:1px solid #67816f}
.score-legend .score-eagle{background:#dfb24e}.score-legend .score-birdie{background:#376d5d}.score-legend .score-par{background:transparent}.score-legend .score-bogey{background:#6f4650}.score-legend .score-double{background:#4c2632}
.weekly-stats{margin-top:26px}
.round-metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}
.round-metric{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px}
.duo-stats{display:flex;justify-content:space-between;gap:10px;margin-top:12px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.duo-stats strong{color:var(--ink);font-size:16px;display:block}
.trend-panel{margin-bottom:18px}
.select-stack{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800}
.select-stack .filter{min-width:170px;max-width:220px;text-transform:none}
.trend-svg{display:block;width:100%;height:auto;min-width:0}
.chart-wrap{margin-top:18px}
.chart-legend{display:flex;justify-content:center;gap:22px;color:var(--muted);font-size:12px;margin-top:3px}
.chart-legend span{display:flex;gap:7px;align-items:center}
.chart-legend i{display:inline-block;width:11px;height:11px;border-radius:50%}
.legend-kyle{background:var(--gold)}.legend-ryan{background:var(--mint)}
.record-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.record-card{padding:23px;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column}
.record-label{color:var(--muted);text-transform:uppercase;letter-spacing:.095em;font-size:11px;font-weight:800}
.record-number{font:700 32px Georgia,serif;color:var(--gold);margin:15px 0 3px}
.record-card p{flex:1;color:var(--muted);font-size:13px;min-height:37px}
.pending-note{color:var(--muted);font-size:11px}
.record-notes{margin-top:17px}
.result-cards{display:grid;gap:12px}
.result-card .result-rounds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}
.result-rounds>div{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:15px}
.result-rounds h3{margin:7px 0}
.result-rounds strong{font-size:18px}
.result-rounds strong small{font-size:12px;color:var(--gold)}
.link-inline{margin-top:3px}
.empty.compact{padding:26px 14px}
.empty.compact p{margin-bottom:0}
@media(max-width:1020px){
  .spotlight{grid-template-columns:1fr}
  .spotlight-side{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .spotlight-side-divider{display:none}
  .spotlight-side .season-big{grid-row:1/4;grid-column:2;margin:0;text-align:right}
  .record-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hole-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}

  .hero{padding-top:18px}

  .spotlight-side{display:none}

  .spotlight-courses h3{font-size:19px}

const prettyDate=iso=>{const d=new Date(String(iso).slice(0,10)+'T12:00:00Z');return Number.isNaN(d.getTime())?String(iso||'TBD'):d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})};
const getResult=w=>results.find(r=>Number(r.week)===Number(w))||{};
const weekStatus=s=>{const r=getResult(s.week);if(numeric(r.scrambleGross)&&numeric(r.kyleGross)&&numeric(r.ryanGross))return "Completed";if(numeric(r.scrambleGross)||numeric(r.kyleGross)||numeric(r.ryanGross))return "In progress";return s.status||"Planned";};
const completed=()=>results.filter(r=>numeric(r.kyleGross)&&numeric(r.ryanGross));
const completedTeam=()=>results.filter(r=>numeric(r.scrambleGross));
const average=vals=>vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'—';
function stats(){const all=completed(),k=all.filter(r=>Number(r.kyleGross)<Number(r.ryanGross)).length,g=all.filter(r=>Number(r.ryanGross)<Number(r.kyleGross)).length,t=all.length-k-g;
const kpt=results.reduce((x,r)=>x+(numeric(r.kylePts)?Number(r.kylePts):0),0),gpt=results.reduce((x,r)=>x+(numeric(r.ryanPts)?Number(r.ryanPts):0),0);
const kavg=average(all.filter(r=>numeric(r.kyleToPar)).map(r=>Number(r.kyleToPar))),gavg=average(all.filter(r=>numeric(r.ryanToPar)).map(r=>Number(r.ryanToPar)));
return {all,k,g,t,kpt,gpt,kavg,gavg,bestKyle:all.length?Math.min(...all.map(r=>Number(r.kyleGross))):'—',bestRyan:all.length?Math.min(...all.map(r=>Number(r.ryanGross))):'—',team:completedTeam(),teamBest:completedTeam().length?Math.min(...completedTeam().map(r=>Number(r.scrambleGross))):'—'};}

function isWeekFinished(s){const r=getResult(s.week);return numeric(r.scrambleGross)&&numeric(r.kyleGross)&&numeric(r.ryanGross);}
function latestTourResult(){return results.filter(r=>numeric(r.kyleGross)||numeric(r.ryanGross)||numeric(r.scrambleGross)).sort((a,b)=>Number(b.week)-Number(a.week))[0]||null;}

function cupRace(){
 const d=stats(),played=d.all.length,remaining=Math.max(0,schedule.length-played);
 const lead=d.kpt===d.gpt?"tie":d.kpt>d.gpt?"Kyle":"Ryan";
 const name=lead==="Kyle"?"Kyle Hiscock":lead==="Ryan"?"Ryan Grace":null;
 let run=0,streakName="";
 for(const r of d.all.slice().sort((a,b)=>Number(b.week)-Number(a.week))){
  const w=Number(r.kyleGross)<Number(r.ryanGross)?"Kyle":Number(r.ryanGross)<Number(r.kyleGross)?"Ryan":"Tie";
  if(w==="Tie"||(run&&w!==streakName))break;
  streakName=w;run++;
 }
 const margin=Math.abs(d.kpt-d.gpt),maxSwing=remaining*2;
 return {d,played,remaining,lead,name,run,streakName,margin,maxSwing,clinched:played>0&&!!name&&margin>maxSwing};
}

 return `<div class="race-panel"><div class="tiny-heading">WINTER CUP RACE</div><h3>${esc(headline)}</h3><p>${esc(detail)}</p>${bar("Kyle Hiscock",d.kpt,"kylebar")}${bar("Ryan Grace",d.gpt,"ryanbar")}<div class="race-facts"><span><strong>${d.k}–${d.g}</strong> Stroke wins</span><span><strong>${d.t}</strong> Ties</span><span><strong>${c.remaining}</strong> Weeks left</span>${c.run?`<span><strong>${c.run}</strong> ${c.streakName} win streak</span>`:""}</div><a class="quiet-link" href="#/stats">Compare player stats →</a></div>`;
}
function weeklyRecap(week){
 const r=getResult(week);if(!numeric(r.scrambleGross)&&!numeric(r.kyleGross)&&!numeric(r.ryanGross))return "";
 const parts=[],records=[],teamReady=numeric(r.scrambleGross),strokeReady=numeric(r.kyleGross)&&numeric(r.ryanGross);
 if(strokeReady){
  const k=Number(r.kyleGross),g=Number(r.ryanGross),margin=Math.abs(k-g);
  parts.push(k===g?"Kyle and Ryan tied in stroke play.":`${k<g?"Kyle":"Ryan"} won the stroke-play round by ${margin} ${margin===1?"stroke":"strokes"}.`);
  parts.push(`Kyle ${fmt(k)}${numeric(r.kyleToPar)?` (${sign(r.kyleToPar)})`:""} · Ryan ${fmt(g)}${numeric(r.ryanToPar)?` (${sign(r.ryanToPar)})`:""}.`);
  if(numeric(r.kylePts)&&numeric(r.ryanPts))parts.push(`Cup points: Kyle ${fmt(r.kylePts)}, Ryan ${fmt(r.ryanPts)}.`);
  const previous=completed().filter(x=>Number(x.week)<Number(week));
  if(previous.length){
   const allPrior=previous.flatMap(x=>[Number(x.kyleGross),Number(x.ryanGross)]);
   if(Math.min(k,g)<Math.min(...allPrior))records.push("New lowest individual gross");
   const olderMargins=previous.map(x=>Math.abs(Number(x.kyleGross)-Number(x.ryanGross)));
   if(margin>0&&margin>Math.max(...olderMargins))records.push("New largest stroke-play victory");
  }
 }
 if(teamReady){
  parts.push(`Team scramble: ${fmt(r.scrambleGross)}${numeric(r.scrambleToPar)?` (${sign(r.scrambleToPar)})`:""}.`);
  const prior=completedTeam().filter(x=>Number(x.week)<Number(week));
  if(prior.length&&Number(r.scrambleGross)<Math.min(...prior.map(x=>Number(x.scrambleGross))))records.push("New lowest team scramble score");
 }
 return `<div class="recap-summary"><div class="tiny-heading">THE WEEK IN REVIEW</div><p>${esc(parts.join(" "))}</p>${records.length?`<div class="recap-records">${records.map(x=>`<span>★ ${esc(x)}</span>`).join("")}</div>`:""}</div>`;
}
function yardageFromTee(s){const x=String(s||"").match(/([0-9]{1,2}),([0-9]{3})\s*yd/);return x?Number(x[1]+x[2]):null}
function teeAdvice(tee,kind){
 const yd=yardageFromTee(tee),limit=kind==="stroke"?6650:6750;
 if(yd==null)return {type:"verify",message:"Tee length unverified — confirm a suitable option in GSPro."};
 if(yd>limit)return {type:"long",message:`Long layout (${yd.toLocaleString("en-US")} yd) — consider the next shorter verified tee.`};
 return null;
}

function tourNYDate(){

}

function scoreKind(score,par){
  if(!numeric(score)||!numeric(par))return "unknown";
  const diff=Number(score)-Number(par);
  return diff<=-2?"eagle":diff===-1?"birdie":diff===0?"par":diff===1?"bogey":"double";
}

function scoreBadge(score,par){
  return `<span class="score-mark ${scoreKind(score,par)}">${numeric(score)?esc(fmt(score)):"—"}</span>`;
}

function nineTotal(records,key,from,to){
  const slice=Array.from({length:to-from+1},(_,i)=>records.find(x=>Number(x.hole)===from+i)||{});
  return slice.every(x=>numeric(x[key]))?slice.reduce((n,x)=>n+Number(x[key]),0):"—";
}

  const r=getResult(s.week),status=weekStatus(s);
  const safeLink=(u,label)=>/^https:\/\/[^\s"<>]+$/.test(String(u||""))?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`:"";
  const course=(round,name,gs,tee,fw,gr,wind,pins,gimme,source,why)=>`<div class="round-course"><div class="tiny-heading">ROUND ${round} · 18 HOLES</div><h3>${esc(name)}</h3><div class="course-tees">${esc(tee||"Tee TBD")}</div><div class="muted-note">GSPro: ${esc(gs||name)}</div><div class="course-detail-grid"><span>Gimme <strong>${esc(gimme||"—")}</strong></span><span>Wind <strong>${esc(wind||"—")}</strong></span><span>Fairways <strong>${esc(fw||"—")}</strong></span><span>Greens <strong>${esc(gr||"—")}</strong></span><span>Pins <strong>${esc(pins||"—")}</strong></span><span>Stimp <strong>${esc(s.stimp||11)}</strong></span></div>${why?`<p class="surface-why"><span>Why this setup</span>${esc(why)}</p>`:""}${safeLink(source,"GSPro course listing")}</div>`;
  const prev=Number(s.week)>1?`<a class="quiet-link" href="#/week/${Number(s.week)-1}">← Week ${Number(s.week)-1}</a>`:"<span></span>";
  const next=Number(s.week)<schedule.length?`<a class="quiet-link" href="#/week/${Number(s.week)+1}">Week ${Number(s.week)+1} →</a>`:"<span></span>";
  return `<section class="section detail-page"><div class="detail-utility"><a href="#/schedule" class="quiet-link">← Full tour</a><span class="tag">${esc(status)}</span></div><div class="eyebrow">WEEK ${esc(s.week)} · ${esc(prettyDate(s.date))}</div><h1 class="detail-heading">${esc(s.theme)}</h1><p class="lede">Two courses. Thirty-six holes. One night. <strong>${esc(s.realism||"Force Realistic")} · Stimp ${esc(s.stimp||11)}</strong></p><div class="detail-actions"><a class="linkbutton" href="#/results">All results</a><button type="button" class="linkbutton" data-share-week="${esc(s.week)}">Share this week <span aria-hidden="true">↗</span></button></div><div class="round-two-grid">${course(1,s.scramble,s.scrambleGs,s.teeScramble,s.scrambleFairway,s.scrambleGreen,s.windScramble,s.pinsScramble,s.gimmeScramble,s.sourceScramble,s.conditionNoteScramble)}${course(2,s.stroke,s.strokeGs,s.teeStroke,s.strokeFairway,s.strokeGreen,s.windStroke,s.pinsStroke,s.gimmeStroke,s.sourceStroke,s.conditionNoteStroke)}</div><div class="sectiontop"><div><h2>Round 1 · Two-man scramble</h2><p>${esc(s.scramble)} · 2-foot gimmes</p></div><div class="result-chip">Team ${fmt(r.scrambleGross)} <span>${sign(r.scrambleToPar)}</span></div></div>${roundScoreboard("scramble",s.week)}<div class="sectiontop scores-gap"><div><h2>Round 2 · Individual stroke play</h2><p>${esc(s.stroke)} · 5-foot gimmes</p></div></div><div class="player-summary"><div class="score-summary"><span>KYLE HISCOCK</span><strong>${fmt(r.kyleGross)}</strong><small>${sign(r.kyleToPar)}</small></div><div class="score-summary"><span>RYAN GRACE</span><strong>${fmt(r.ryanGross)}</strong><small>${sign(r.ryanToPar)}</small></div><div class="score-summary"><span>WINTER CUP WINNER</span><strong class="winner-name">${esc(r.winner||"—")}</strong></div></div>${roundScoreboard("stroke",s.week)}<div class="card weekly-stats"><h3>Stroke-play round stats</h3>${weeklyPerformance(r)}</div><div class="detail-utility bottom-switch">${prev}${next}</div></section>`;
}

function getMetric(){
  const configs={
    toPar:{label:"Score vs. par",k:"kyleToPar",r:"ryanToPar",unit:" strokes",dec:1},
    gross:{label:"Gross score",k:"kyleGross",r:"ryanGross",unit:" strokes",dec:0},
    fw:{label:"Fairways hit",k:"kFw",r:"gFw",unit:" fairways",dec:0},
    gir:{label:"Greens in regulation",k:"kGir",r:"gGir",unit:" greens",dec:0},
    drive:{label:"Average driving distance",k:"kDrive",r:"gDrive",unit:" yards",dec:1},
    feet:{label:"Feet of putts made",k:"kFeet",r:"gFeet",unit:" feet",dec:1},
    birdies:{label:"Birdies",k:"kBirdies",r:"gBirdies",unit:" birdies",dec:0}
  };
  return configs[trendMetric]||configs.toPar;
}

function trendChart(){
  const m=getMetric(),values=results.filter(x=>numeric(x[m.k])||numeric(x[m.r]));
  if(!values.length)return `<div class="empty compact"><strong>No trend data yet</strong><p>As soon as Kyle and Ryan log their stroke-play scores or full-round GSPro stats, the chart will show each week’s results.</p></div>`;
  const arr=values.flatMap(r=>[r[m.k],r[m.r]]).filter(numeric).map(Number);
  let lo=Math.min(...arr),hi=Math.max(...arr);
  if(hi===lo){hi+=1;lo-=1}else{const pad=(hi-lo)*.15;hi+=pad;lo-=pad;}
  const x=w=>54+(Math.max(1,Math.min(schedule.length,Number(w)))-1)*(660/Math.max(1,schedule.length-1));
  const lowerIsBetter=trendMetric==='toPar'||trendMetric==='gross';
  const y=v=>36+(lowerIsBetter?(Number(v)-lo)/(hi-lo):1-(Number(v)-lo)/(hi-lo))*197;
  const fmtTick=n=>Number(n).toFixed(m.dec===0?0:1);
  const grid=Array.from({length:5},(_,i)=>{const yy=36+i*197/4,t=lowerIsBetter?lo+i*(hi-lo)/4:hi-i*(hi-lo)/4;return `<line x1="54" y1="${yy}" x2="716" y2="${yy}" stroke="#496b5c" stroke-width="1" opacity=".42"/><text x="43" y="${yy+4}" fill="#b8cbc1" font-size="11" text-anchor="end">${fmtTick(t)}</text>`;}).join("");
  const series=(key,color,name)=>{
    const points=values.filter(r=>numeric(r[key])).sort((a,b)=>Number(a.week)-Number(b.week));
    const segments=points.slice(1).map((v,i)=>{const p=points[i];return `<line x1="${x(p.week)}" y1="${y(p[key])}" x2="${x(v.week)}" y2="${y(v[key])}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`;}).join("");
    const dots=points.map(v=>`<circle cx="${x(v.week)}" cy="${y(v[key])}" r="5" fill="${color}" stroke="#102620" stroke-width="2"><title>${name} · Week ${v.week}: ${Number(v[key]).toFixed(m.dec)}${m.unit}</title></circle>`).join("");
    return segments+dots;
  };
  const ticks=[1,5,10,15,20,schedule.length].filter((w,i,a)=>w<=schedule.length&&a.indexOf(w)===i).map(w=>`<text x="${x(w)}" y="263" fill="#b8cbc1" font-size="12" text-anchor="middle">W${w}</text>`).join("");
  return `<div class="chart-wrap"><svg role="img" aria-label="${esc(m.label)} by tour week for Kyle Hiscock and Ryan Grace" viewBox="0 0 760 278" class="trend-svg" xmlns="http://www.w3.org/2000/svg">${grid}${ticks}${series(m.k,"#e9b477","Kyle")}${series(m.r,"#a5dfb1","Ryan")}</svg><div class="chart-legend"><span><i class="legend-kyle"></i>Kyle Hiscock</span><span><i class="legend-ryan"></i>Ryan Grace</span></div><p class="muted-note" style="text-align:center;margin:8px 0 0">${lowerIsBetter?'Lower scores are better.':'Higher values are better.'} Hover over a point for its exact weekly value.</p></div>`;
}

function statPage(){
  const d=stats(),m=getMetric(),r=getResult(selectedWeek);
  const metricOpts=[["toPar","Score vs. par"],["gross","Gross score"],["fw","Fairways hit"],["gir","GIR"],["drive","Average drive"],["feet","Putts made (feet)"],["birdies","Birdies"]];
  return `<section class="section"><div class="sectiontop"><div><h2>Player comparisons</h2><p>Week-by-week progress, using complete stroke-play rounds and captured GSPro statistics only.</p></div></div><div class="kpis">${kpi("Kyle average ± par",d.kavg,"completed rounds")}${kpi("Ryan average ± par",d.gavg,"completed rounds")}${kpi("Kyle best gross",d.bestKyle,"18-hole stroke play")}${kpi("Ryan best gross",d.bestRyan,"18-hole stroke play")}</div><div class="card trend-panel"><div class="course-head"><div><h3>${esc(m.label)} · Seasonal trend</h3><p class="intro">Kyle vs. Ryan across the 26-week tour</p></div><label class="select-stack">Metric<select id="trendMetric" class="filter" aria-label="Choose trend metric">${metricOpts.map(([key,label])=>`<option value="${key}" ${trendMetric===key?"selected":""}>${esc(label)}</option>`).join("")}</select></label></div>${trendChart()}</div><div class="card weekly-stats"><div class="course-head"><div><h3>Full-round performance</h3><p class="intro">Select any week to compare available GSPro stats.</p></div><label class="select-stack">Week<select class="filter" id="weekFilter" aria-label="Select week">${schedule.map(s=>`<option value="${s.week}" ${selectedWeek===Number(s.week)?"selected":""}>Week ${s.week}</option>`).join("")}</select></label></div>${weeklyPerformance(r)}<a class="quiet-link inline-week" href="#/week/${selectedWeek}">View Week ${selectedWeek} scorecards →</a></div></section>`;
}

function recordsPage(){
  const individual=completed(),teams=completedTeam(),entries=individual.flatMap(r=>[{n:"Kyle Hiscock",gross:r.kyleGross,toPar:r.kyleToPar,birdies:r.kBirdies,week:Number(r.week)},{n:"Ryan Grace",gross:r.ryanGross,toPar:r.ryanToPar,birdies:r.gBirdies,week:Number(r.week)}]);
  const byMin=(rows,key)=>rows.filter(r=>numeric(r[key])).sort((a,b)=>Number(a[key])-Number(b[key]))[0];
  const byMax=(rows,key)=>rows.filter(r=>numeric(r[key])).sort((a,b)=>Number(b[key])-Number(a[key]))[0];
  const best=byMin(entries,"gross"),rel=byMin(entries,"toPar"),bird=byMax(entries,"birdies"),team=byMin(teams,"scrambleGross");
  const margins=individual.map(r=>({...r,margin:Math.abs(Number(r.kyleGross)-Number(r.ryanGross))})).filter(x=>x.margin>0);
  const blowout=byMax(margins,"margin");
  let active="",count=0,peak={n:"",count:0,week:0};
  for(const r of individual.slice().sort((a,b)=>Number(a.week)-Number(b.week))){
    const w=Number(r.kyleGross)<Number(r.ryanGross)?"Kyle Hiscock":Number(r.ryanGross)<Number(r.kyleGross)?"Ryan Grace":"Tie";
    if(w==="Tie"){active="";count=0;continue;}
    count=w===active?count+1:1;active=w;
    if(count>peak.count)peak={n:w,count,week:r.week};
  }
  const card=(label,value,detail,week)=>`<article class="record-card"><div class="record-label">${esc(label)}</div><div class="record-number">${esc(value)}</div><p>${esc(detail)}</p>${week?`<a class="quiet-link" href="#/week/${Number(week)}">Week ${Number(week)} scorecard →</a>`:"<span class='pending-note'>Awaiting official scores</span>"}</article>`;
  return `<section class="section">${h("The record book","Personal bests, team milestones, and head-to-head history. Only verified results count.")}<div class="record-grid">${card("Lowest individual gross",best?fmt(best.gross):"—",best?`${best.n} · Week ${best.week}`:"First 18-hole stroke round",best?.week)}${card("Best round vs. par",rel?sign(rel.toPar):"—",rel?`${rel.n} · Week ${rel.week}`:"First completed stroke round",rel?.week)}${card("Largest victory",blowout?`${fmt(blowout.margin)} strokes`:"—",blowout?`${Number(blowout.kyleGross)<Number(blowout.ryanGross)?"Kyle Hiscock":"Ryan Grace"} · Week ${blowout.week}`:"First decisive head-to-head round",blowout?.week)}${card("Most birdies in a round",bird?fmt(bird.birdies):"—",bird?`${bird.n} · Week ${bird.week}`:"First complete scorecard",bird?.week)}${card("Lowest team scramble",team?fmt(team.scrambleGross):"—",team?`Week ${team.week} · ${team.scramble||"team scramble"}`:"First 18-hole scramble",team?.week)}${card("Longest win streak",peak.count?`${peak.count} ${peak.count===1?"win":"wins"}`:"—",peak.count?`${peak.n} · consecutive played rounds`:"First head-to-head win",peak.count?peak.week:null)}</div><p class="muted-note record-notes">Records update from the Google Sheet. Scramble records are shared; only individual stroke play awards Winter Cup points.</p></section>`;
}
function rules(){
const items=[
['01 · Weekly format','Every Tuesday features two separate 18-hole rounds on different GSPro courses. Round 1 is a two-man team scramble; Round 2 is individual gross stroke play.'],
['02 · Winter Cup scoring','Only the individual stroke-play round counts toward the head-to-head Winter Cup. A win earns two points; a tie awards one point to each player.'],
['03 · Team scramble challenge','The opening scramble is a shared team challenge, not a head-to-head competition. Team scores and season scramble records belong to both players.'],
['04 · Simulator settings','Stimp 11, Force Realistic, no mulligans, and tees measuring approximately 6,000–7,000 yards. Scramble gimmes are 2 feet; individual stroke-play gimmes are 5 feet.'],
['05 · Course conditions','These are representative, well-maintained playing-season conditions rather than live forecasts or maximum-tournament difficulty. Fairway and green firmness, wind and pin placements are selected for each venue, while Stimp remains 11 all season.'],
['06 · Season championship','After 26 weeks, the player with the most Winter Cup points wins. Tiebreakers are stroke-play wins, average score relative to par, then a playoff.']
];
return `<section class="section" style="padding-top:32px">${h('Format & Rules','How the two weekly rounds work, how the Winter Cup is scored, and how the season champion is decided.')}<div class="rulesgrid">${items.map(x=>`<div class="card rule"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`).join('')}</div><p class="intro" style="margin-top:14px">Unofficial simulator tour. Scores are not automatically WHS/GHIN handicap rounds; course availability and tee settings are subject to confirmation at the venue.</p></section>`;}
function routeFromHash(){
  const match=String(location.hash||"").match(/^#\/(home|schedule|results|stats|records|rules|week)(?:\/(\d{1,2}))?$/);
  page=match?match[1]:"home";
  if(match&&match[2]){const w=Number(match[2]);if(w>=1&&w<=schedule.length)selectedWeek=w;}
  render();
}

function render(){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===page));
  const pages={home,schedule:tour,results:resultsPage,stats:statPage,records:recordsPage,rules,week:weekPage};
  document.getElementById("app").innerHTML=pages[page]();
  const wk=document.getElementById("weekFilter");
  if(wk)wk.addEventListener("change",e=>{selectedWeek=Number(e.target.value);location.hash="#/stats/"+selectedWeek;render();});
  const metric=document.getElementById("trendMetric");
  if(metric)metric.addEventListener("change",e=>{trendMetric=e.target.value;render();});
}

function shareWeek(week){
  const link=new URL("#/week/"+week,location.href).href;
  if(navigator.share){navigator.share({title:"Winter Grind Tour · Week "+week,url:link}).catch(()=>{});return;}
  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(link).then(()=>{const e=document.querySelector("[data-share-week]");if(e)e.textContent="Link copied ✓";}).catch(()=>window.prompt("Copy this week link:",link));return;}
  window.prompt("Copy this week link:",link);
}

function handleClick(e){
  const share=e.target.closest("[data-share-week]");
  if(share){shareWeek(Number(share.dataset.shareWeek));return;}
  const w=e.target.closest("[data-show-week]");
  if(w){location.hash="#/week/"+Number(w.dataset.showWeek);return;}
  const b=e.target.closest("[data-tab]");
  if(b){location.hash="#/"+b.dataset.tab;}
}
document.addEventListener("click",handleClick);
window.addEventListener("hashchange",routeFromHash);
document.getElementById("homeBrand").addEventListener("click",e=>{e.preventDefault();location.hash="#/home";});

window.receiveLeagueData=function(data){if(!data||!Array.isArray(data.schedule)||!Array.isArray(data.results)){feedState='unavailable';render();return;}schedule=data.schedule.length?data.schedule.map(x=>({...base.find(b=>Number(b.week)===Number(x.week)),...x})):schedule;results=data.results;strokeHoles=Array.isArray(data.strokeHoles)?data.strokeHoles:[];scrambleHoles=Array.isArray(data.scrambleHoles)?data.scrambleHoles:[];feedState='ready';render();};
if(APPS_SCRIPT_URL){const script=document.createElement('script');script.src=APPS_SCRIPT_URL+(APPS_SCRIPT_URL.includes('?')?'&':'?')+'callback=receiveLeagueData';script.async=true;script.onerror=()=>{feedState='unavailable';render()};document.head.appendChild(script)}

routeFromHash();

</script></body></html>
